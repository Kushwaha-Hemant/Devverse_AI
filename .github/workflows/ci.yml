name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # Builds with no env set: every API route degrades to its offline
      # fallback rather than failing, so this needs no secrets.
      - run: npm run build
